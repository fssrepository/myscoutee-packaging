name: Release Packaging package

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: myscoutee-packaging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: myscoutee-packaging
      - name: Check out pinned myscoutee-backend integration fixture
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fssrepository/myscoutee-backend
          ref: 62f1fafcfd00746feed00f59c22ecd4809925bcd
          path: myscoutee-backend
          token: ${{ secrets.RELEASE_FIXTURES_TOKEN }}
      - name: Check out pinned myscoutee-template integration fixture
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fssrepository/myscoutee-template
          ref: 1a8a5423349cb7bbcda03ff7024f9f7bd67e5eeb
          path: myscoutee-template
      - name: Check out pinned myscoutee-registry integration fixture
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fssrepository/myscoutee-registry
          ref: c77478ccbb80dadc7dd28348170b5d3c707908e6
          path: myscoutee-registry
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@fssrepository'
      - name: Verify tag and package identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);
          assert.equal(pkg.name, '@fssrepository/myscoutee-packaging');
          JS
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 -m pip install PyYAML
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
      - name: Pack tested release
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Publish and verify registry artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="$RUNNER_TEMP/fssrepository-myscoutee-packaging-$version.tgz"
          npm publish "$archive" --tag latest --registry=https://npm.pkg.github.com
          expected="$(node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; console.log("sha512-" + createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"))' "$archive")"
          actual="$(npm view "@fssrepository/myscoutee-packaging@$version" dist.integrity --registry=https://npm.pkg.github.com)"
          [[ "$actual" == "$expected" ]]
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="$RUNNER_TEMP/fssrepository-myscoutee-packaging-$version.tgz"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$archive")") > "$RUNNER_TEMP/SHA256SUMS"
          {
            printf 'Shared Packaging package **%s** for Node.js 22 or newer.\n\n' "$version"
            printf 'Package: `@fssrepository/myscoutee-packaging@%s`\n\n' "$version"
            printf 'Registry: `https://npm.pkg.github.com`\n\nSource: `%s`\n\n' "$GITHUB_SHA"
            printf 'Shared helper checks passed. Registry integrity matches the attached tarball.\n'
          } > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "MyScoutee Packaging $version" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$GITHUB_REF_NAME" "$archive" "$RUNNER_TEMP/SHA256SUMS" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$RUNNER_TEMP/SHA256SUMS" \
              --verify-tag --title "MyScoutee Packaging $version" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
